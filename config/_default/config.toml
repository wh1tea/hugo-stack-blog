# 站点基础配置 —— 更多配置见同目录下其他文件
# baseurl 改为部署后的实际地址（GitHub Pages）
baseurl = "https://wh1tea.github.io/hugo-stack-blog/"
title   = "Wh1tea"

# 默认语言设为中文：中文内容在根路径，英文在 /en/
# 多语言定义见 languages.toml
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# 默认语言含中日韩文字时设为 true，保证字数统计 / 摘要 / 阅读时长正确
hasCJKLanguage = true

# 评论功能：在 params.toml 中打开前请先换成自己的 Disqus shortname
disqusShortname = "hugo-theme-stack"

[pagination]
    pagerSize = 5
