[[imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[[mounts]]
    source = "content/zh"
    target = "content"

    [mounts.sites.matrix]
        languages = ["zh"]

[[mounts]]
    source = "content/en"
    target = "content"

    [mounts.sites.matrix]
        languages = ["en"]

[[mounts]]
    source = "content/private"
    target = "content"
    files = [
        "! _templates/**",
        "! archives/**",
        "! README.md",
    ]

    [mounts.sites.matrix]
        languages = ["private"]
